<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Educativo - Enfermedades Infecciosas</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
    color: #1a1a1a;
  }

  .contenedor {
    max-width: 700px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .encabezado {
    background: #1d4ed8;
    color: white;
    padding: 20px;
    text-align: center;
  }

  .encabezado h1 {
    margin: 0;
    font-size: 22px;
  }

  .encabezado p {
    margin: 5px 0 0;
    font-size: 14px;
    opacity: 0.9;
  }

  .cuerpo {
    padding: 20px;
  }

  /* ---- Selector de enfermedades ---- */
  #pantalla-inicio h2 {
    font-size: 16px;
    color: #444;
  }

  .lista-enfermedades {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .boton-enfermedad {
    background: #eef2ff;
    border: 2px solid #1d4ed8;
    color: #1d4ed8;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: left;
    transition: 0.2s;
  }

  .boton-enfermedad:hover {
    background: #1d4ed8;
    color: white;
  }

  /* ---- Pantalla de preguntas ---- */
  #pantalla-preguntas {
    display: none;
  }

  .barra-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  #nombre-enfermedad-actual {
    font-size: 18px;
    font-weight: bold;
    color: #1d4ed8;
  }

  .boton-volver {
    background: #e5e7eb;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }

  .grid-preguntas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  @media (max-width: 500px) {
    .grid-preguntas {
      grid-template-columns: 1fr;
    }
  }

  .boton-pregunta {
    background: #f9fafb;
    border: 1px solid #d1d5db;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
  }

  .boton-pregunta:hover {
    background: #dbeafe;
    border-color: #1d4ed8;
  }

  .caja-respuesta {
    background: #f9fafb;
    border-left: 4px solid #1d4ed8;
    padding: 15px;
    border-radius: 8px;
    min-height: 60px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .caja-respuesta .titulo-respuesta {
    font-weight: bold;
    color: #1d4ed8;
    display: block;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>🦠 Chatbot Educativo</h1>
    <p>Enfermedades Infecciosas</p>
  </div>

  <div class="cuerpo">

    <!-- PANTALLA 1: elegir enfermedad -->
    <div id="pantalla-inicio">
      <h2>Selecciona una enfermedad:</h2>
      <div class="lista-enfermedades" id="lista-enfermedades"></div>
    </div>

    <!-- PANTALLA 2: preguntas y respuesta -->
    <div id="pantalla-preguntas">
      <div class="barra-superior">
        <span id="nombre-enfermedad-actual"></span>
        <button class="boton-volver" onclick="volverInicio()">⬅ Volver</button>
      </div>

      <div class="grid-preguntas" id="grid-preguntas"></div>

      <div class="caja-respuesta" id="caja-respuesta">
        <span class="titulo-respuesta">Respuesta:</span>
        <span id="texto-respuesta">Selecciona una pregunta arriba.</span>
      </div>
    </div>

  </div>
</div>

/* =========================================================================
   LÓGICA DEL CHATBOT (no necesitas tocar esto)
   ========================================================================= */

let enfermedadSeleccionada = null;

function iniciar() {
  const lista = document.getElementById("lista-enfermedades");
  lista.innerHTML = "";
  enfermedades.forEach((enf, indice) => {
    const boton = document.createElement("button");
    boton.className = "boton-enfermedad";
    boton.textContent = enf.nombre;
    boton.onclick = () => mostrarPreguntas(indice);
    lista.appendChild(boton);
  });
}

function mostrarPreguntas(indice) {
  enfermedadSeleccionada = enfermedades[indice];

  document.getElementById("pantalla-inicio").style.display = "none";
  document.getElementById("pantalla-preguntas").style.display = "block";
  document.getElementById("nombre-enfermedad-actual").textContent = enfermedadSeleccionada.nombre;

  const grid = document.getElementById("grid-preguntas");
  grid.innerHTML = "";
  preguntas.forEach(p => {
    const boton = document.createElement("button");
    boton.className = "boton-pregunta";
    boton.textContent = p.texto;
    boton.onclick = () => mostrarRespuesta(p);
    grid.appendChild(boton);
  });

  document.getElementById("texto-respuesta").textContent = "Selecciona una pregunta arriba.";
}

function mostrarRespuesta(pregunta) {
  const respuesta = enfermedadSeleccionada[pregunta.campo];
  document.getElementById("texto-respuesta").textContent = respuesta;
}

function volverInicio() {
  document.getElementById("pantalla-preguntas").style.display = "none";
  document.getElementById("pantalla-inicio").style.display = "block";
}

// Arrancar el chatbot al cargar la página
iniciar();
